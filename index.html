<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Building Size Comparison</h1>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by building, city or country...">
  </div>
  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-section">
    <h2>Comparison Area</h2>
    
    <div class="stage-controls">
      <!-- Rząd 1: Przyciski akcji -->
      <div class="controls-row">
        <button class="btn-action" id="toggleFsBtn" onclick="toggleFullscreen()">Open Interactive Canvas</button>
        <button class="btn-reset" onclick="clearStage()">Clear</button>
      </div>

      <!-- Rząd 2: Trzy znaczniki w jednym rzędzie -->
      <div class="controls-row">
        <label class="toggle-label">
          <input type="checkbox" id="showNamesCheckbox"> Names
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="showHeightCheckbox"> Height
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="showYearsCheckbox"> Years built
        </label>
      </div>

      <!-- Rząd 3: Siatka + Jednostki -->
      <div class="controls-row">
        <label class="toggle-label">
          <input type="checkbox" id="showGridCheckbox"> Grid:
        </label>
        <div class="unit-selector disabled" id="unitSelector">
          <label class="radio-label">
            <input type="radio" name="gridUnit" value="metric" checked disabled> Metric (m)
          </label>
          <label class="radio-label">
            <input type="radio" name="gridUnit" value="imperial" disabled> Imperial (ft)
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Płótno (Canvas Wrapper) - czyste, nienaruszone -->
  <div class="stage-wrapper" id="stageWrapper">
    <button class="close-fullscreen-btn" onclick="toggleFullscreen()">Close Fullscreen</button>
    <div id="stage">
      <div id="gridOverlay" class="grid-overlay"></div>
    </div>
  </div>

  <!-- Zewnętrzna tabela jako osobny prostokąt pod płótnem -->
  <div id="externalTableContainer" class="external-table-container hidden">
    <div class="ext-row" id="rowNames">
      <div class="ext-label">Name</div>
      <div class="ext-cells" id="cellsNames"></div>
    </div>
    <div class="ext-row" id="rowHeight">
      <div class="ext-label">Height</div>
      <div class="ext-cells" id="cellsHeight"></div>
    </div>
    <div class="ext-row" id="rowYears">
      <div class="ext-label">Year</div>
      <div class="ext-cells" id="cellsYears"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
