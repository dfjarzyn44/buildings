<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Size Comparison</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Building Size Comparison</h1>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Szukaj budynku, miasta lub kraju...">
  </div>
  <div class="grid" id="buildingsGrid"></div>

  <div class="stage-header">
    <h2>Płótno Porównawcze</h2>
    <div class="stage-controls">
      <div class="controls-row">
        <label class="toggle-label"><input type="checkbox" id="showNamesCheckbox" checked> Nazwy</label>
        <label class="toggle-label"><input type="checkbox" id="showHeightCheckbox" checked> Wysokość</label>
        <label class="toggle-label"><input type="checkbox" id="showYearsCheckbox" checked> Rok budowy</label>
        <label class="toggle-label"><input type="checkbox" id="showGridCheckbox" checked> Siatka</label>
        <div class="unit-selector" id="unitSelector">
          <label class="radio-label"><input type="radio" name="gridUnit" value="metric" checked> Metry</label>
          <label class="radio-label"><input type="radio" name="gridUnit" value="imperial"> Stopy</label>
        </div>
      </div>
      <div class="controls-row">
        <button class="btn-action" id="toggleFsBtn" onclick="toggleFullscreen()">Otwórz interaktywne płótno</button>
        <span>Skala: <strong id="zoomVal">100%</strong></span>
        <button class="btn-reset" onclick="clearStage()">Reset</button>
      </div>
    </div>
  </div>

  <div class="stage-wrapper" id="stageWrapper">
    <button class="close-fullscreen-btn" onclick="toggleFullscreen()">Zamknij pełny ekran</button>
    <div id="gridOverlay"></div>
    <div id="stage"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
